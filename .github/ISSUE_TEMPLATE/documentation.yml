name: Documentation problem
description: Something in the documentation is wrong, unclear, or missing.
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: The file or page, and the section.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or unclear
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What it should say
