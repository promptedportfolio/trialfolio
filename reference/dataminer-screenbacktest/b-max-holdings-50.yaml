# Trial Folio reference export B: baseline with 50 holdings (release 0.1.0, task R01-T01)
#
# Identical to a-baseline.yaml except Max Num Holdings (25 -> 50).
# Exercises a declared intended change in a review.
#
# Save the output as exports/b-max-holdings-50.csv. See README.md in this folder.

Main:
    Operation: ScreenBacktest
    On Error: Stop
    Precision: 4

Default Settings:
    Vendor: FactSet            # Portfolio123's standard data (docs/spec.md D-16)
    Type: Stock
    Method: Long
    Currency: USD
    Universe: SP500
    Benchmark: SPY
    PIT Method: Complete
    Trans Price: Open
    Start Date: 2016-01-01
    End Date: 2025-12-31
    Rebalance Frequency: 4Weeks
    Max Num Holdings: 50        # the only change from a-baseline.yaml
    Rank Tolerance: 0
    Slippage: 0.25
    Risk Stats Period: Monthly
    Ranking:                    # single formula: creates no APIRankingSystem
        Formula: "EarnYield"
        Lower is Better: false
    Rules:
        - AvgDailyTot(30) > 1000000
