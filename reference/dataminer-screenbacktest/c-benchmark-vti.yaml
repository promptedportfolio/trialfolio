# Trial Folio reference export C: baseline against VTI (release 0.1.0, task R01-T01)
#
# Identical to a-baseline.yaml except Benchmark (SPY -> VTI).
# Exercises different benchmarks: benchmark-relative metrics must be flagged
# and not differenced.
#
# Save the output as exports/c-benchmark-vti.csv. See README.md in this folder.

Main:
    Operation: ScreenBacktest
    On Error: Stop
    Precision: 4

Default Settings:
    Vendor: FactSet            # Portfolio123's standard data (docs/spec.md D-16)
    Type: Stock
    Method: Long
    Currency: USD
    Universe: SP500
    Benchmark: VTI              # the only change from a-baseline.yaml
    PIT Method: Complete
    Trans Price: Open
    Start Date: 2016-01-01
    End Date: 2025-12-31
    Rebalance Frequency: 4Weeks
    Max Num Holdings: 25
    Rank Tolerance: 0
    Slippage: 0.25
    Risk Stats Period: Monthly
    Ranking:                    # single formula: creates no APIRankingSystem
        Formula: "EarnYield"
        Lower is Better: false
    Rules:
        - AvgDailyTot(30) > 1000000
