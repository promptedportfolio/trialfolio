# Trial Folio reference export A: baseline (release 0.1.0, task R01-T01)
#
# Purpose: produce one real DataMiner ScreenBacktest export so the 0.1.0
# importer can be built against the actual layout. This is not a strategy.
# Every setting that affects results is explicit, so nothing depends on
# DataMiner's defaults (for example End Date = today, Slippage = 0).
#
# Save the output as exports/a-baseline.csv. See README.md in this folder.

Main:
    Operation: ScreenBacktest
    On Error: Stop
    Precision: 4

Default Settings:
    Vendor: FactSet            # Portfolio123's standard data (docs/spec.md D-16)
    Type: Stock
    Method: Long
    Currency: USD
    Universe: SP500
    Benchmark: SPY
    PIT Method: Complete
    Trans Price: Open
    Start Date: 2016-01-01
    End Date: 2025-12-31
    Rebalance Frequency: 4Weeks
    Max Num Holdings: 25
    Rank Tolerance: 0
    Slippage: 0.25
    Risk Stats Period: Monthly
    Ranking:                    # single formula: creates no APIRankingSystem
        Formula: "EarnYield"
        Lower is Better: false
    Rules:
        - AvgDailyTot(30) > 1000000
