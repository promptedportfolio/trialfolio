# The synthetic experiment's first configuration: the demo's packaged screen as the baseline, with
# the default rebalance variant. The synthetic experiment's writer, in tests/support/, executes it
# with the demo's client, which sends nothing, and then synthetic-revised.yaml as its revision.
kind: experiment
schema_version: 1.0.0
experiment_id: synthetic-earnyield
title: 'Synthetic experiment: earnings yield with a liquidity floor'
purpose: Shows an experiment's files and report offline, from invented values.
prior_research:
  status: complete
  description: None. This experiment is invented for Trial Folio's tests, and no earlier work informed it.
baseline:
  universe: 'SP500'
  rules:
    - 'AvgDailyTot(30) > 1000000'
  ranking:
    formula: 'EarnYield'
    lower_is_better: false
  max_holdings: 25
  benchmark: 'SPY'
  start_date: 2016-01-01
  end_date: 2025-12-31
  rebalance_weeks: 4
  transaction_price: open
  slippage_percent: 0.25
  pit_method: complete
  precision: 4
budget:
  provider_requests: 3
