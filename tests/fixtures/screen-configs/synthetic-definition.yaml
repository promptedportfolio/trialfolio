kind: screen
schema_version: 1.1.0
title: 'Synthetic example: value, momentum, and quality with a liquidity floor'
purpose: Shows a run's files and report offline, with a ranking definition, from invented values.
universe: 'SP500'
rules:
  - 'AvgDailyTot(30) > 1000000'
ranking:
  definition: '../experiment-configs/ranking/synthetic.xml'
  ranking_method: percentile_nas_negative
max_holdings: 25
benchmark: 'SPY'
start_date: 2016-01-01
end_date: 2025-12-31
rebalance_weeks: 4
transaction_price: open
slippage_percent: 0.25
pit_method: complete
precision: 4
