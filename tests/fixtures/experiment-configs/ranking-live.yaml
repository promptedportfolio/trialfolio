kind: experiment
schema_version: 1.1.0
experiment_id: live-ranking-check
title: Earnings and liquidity weights
purpose: Does a weight written into ApiRankingSystem change the screen's result?
prior_research:
  status: complete
  description: None. This experiment is Trial Folio's live check of ranking-weight variants, and no earlier work informed it.
baseline:
  universe: 'SP500'
  rules:
    - 'AvgDailyTot(30) > 1000000'
  ranking:
    definition: 'ranking/live.xml'
    ranking_method: percentile_nas_negative
  max_holdings: 25
  benchmark: 'SPY'
  start_date: 2016-01-01
  end_date: 2025-12-31
  rebalance_weeks: 4
  transaction_price: open
  slippage_percent: 0.25
  pit_method: complete
  precision: 4
variants:
  ranking:
    - key: earnings-heavy
      description: More weight on earnings yield, taken from dollar volume.
      set: {'Earnings': 80, 'Liquidity': 20}
  rebalance_weeks: []
budget:
  provider_requests: 4
