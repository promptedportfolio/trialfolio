# Invalid: A removal leaves its parent at least one node: Price\Book holds one factor.
# Key: variants.ranking[1].remove
# Value: Price\\Book/Book Yield
kind: experiment
schema_version: 1.1.0
experiment_id: positions-weights
title: Weights of nodes named by their positions
purpose: Does the screen's result depend on the weights of factors that only a position names?
prior_research:
  status: unknown
baseline:
  universe: 'SP500'
  rules:
    - 'AvgDailyTot(30) > 1000000'
  ranking:
    definition: '../ranking/positions.xml'
    ranking_method: percentile_nas_negative
  max_holdings: 25
  benchmark: 'SPY'
  start_date: 2016-01-01
  end_date: 2025-12-31
  rebalance_weeks: 4
  transaction_price: open
  slippage_percent: 0.25
  pit_method: complete
  precision: 4
variants:
  ranking:
    - key: positions-heavy
      description: More weight on value and on price to book, taken from the two factors without a name.
      set: {'Value P\/E': 30, '#2': 5, '#3': 5, 'Price\\Book': 25, '\#Momentum': 15, '#6': 20}
    - key: no-first-yield
      remove: 'Price\\Book/Book Yield'
      set: {'Price\\Book/#1': 100}
  rebalance_weeks: []
budget:
  provider_requests: 6
