# ranking-synthetic.yaml, with one change: a removal variant added, and the budget raised to cover
# its two requests. The synthetic experiment's writer executes it as ranking-synthetic.yaml's
# revision, with the reason "Adds a removal variant.".
kind: experiment
schema_version: 1.1.0
experiment_id: synthetic-value-momentum
title: 'Synthetic experiment: value, momentum, and quality weights'
purpose: Shows an experiment's files and report offline, with ranking-weight variants, from invented values.
prior_research:
  status: complete
  description: None. This experiment is invented for Trial Folio's tests, and no earlier work informed it.
baseline:
  universe: 'SP500'
  rules:
    - 'AvgDailyTot(30) > 1000000'
  ranking:
    definition: 'ranking/synthetic.xml'
    ranking_method: percentile_nas_negative
  max_holdings: 25
  benchmark: 'SPY'
  start_date: 2016-01-01
  end_date: 2025-12-31
  rebalance_weeks: 4
  transaction_price: open
  slippage_percent: 0.25
  pit_method: complete
  precision: 4
variants:
  ranking:
    - key: value-heavy
      description: More weight on value, taken equally from momentum and quality.
      set: {'Value': 60, 'Momentum': 20, 'Quality': 20}
    - key: no-sales-yield
      description: Value without its sales-yield factor.
      remove: 'Value/Sales Yield'
      set: {'Value/Earnings Yield': 100}
  rebalance_weeks: []
budget:
  provider_requests: 6
