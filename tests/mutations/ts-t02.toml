# TS-T02's list of the check of the tests (docs/test-refactoring.md), which it ran on its base and
# on its branch. TS-T02 adds the five missing tests, and changes no test that was there. Four
# mutations, those without caught_by, are caught by a test that was there in each test module it
# changes, at the base and on the branch. Each of the others shows what one of the new tests
# checks: no test caught it at the base, and the tests caught_by names catch it on the branch.

# The missing tests' item 1: a date that isn't a calendar date.

[[mutation]]
name = "a YAML date reads as the first day of its month"
file = "src/trialfolio/strict_yaml.py"
old = '''return date.fromisoformat(text)'''
new = '''return date.fromisoformat(text).replace(day=1)'''
tests = ["tests/contract/test_screen_configuration.py"]

[[mutation]]
name = "a date no calendar has is refused in other words"
file = "src/trialfolio/strict_yaml.py"
old = '''raise YamlRefused(path, "isn't a valid date.") from None'''
new = '''raise YamlRefused(path, "isn't a date.") from None'''
tests = ["tests/contract/test_screen_configuration.py"]
caught_by = [
    "tests/contract/test_screen_configuration.py::test_a_date_that_isnt_a_calendar_date_is_rejected",
]

[[mutation]]
name = "a date no calendar has isn't refused as a configuration's problem"
file = "src/trialfolio/strict_yaml.py"
old = '''    except ValueError:
        raise YamlRefused(path, "isn't a valid date.") from None'''
new = '''    except TypeError:
        raise YamlRefused(path, "isn't a valid date.") from None'''
tests = ["tests/contract/test_screen_configuration.py"]
caught_by = [
    "tests/contract/test_screen_configuration.py::test_a_date_that_isnt_a_calendar_date_is_rejected",
    "tests/contract/test_screen_configuration.py::test_invalid_configuration_is_rejected_naming_its_key[date-impossible]",
]

