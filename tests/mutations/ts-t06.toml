# TS-T06's list of the check of the tests (docs/test-refactoring.md), which it ran on its base and
# on its branch. TS-T06 writes once the checks every report makes, in tests/support/html_report.py,
# and the contract modules' helpers, in tests/support/contract_checks.py, and makes each pair of
# records checks one test, parametrized over its experiments. So each test module it changes, or
# whose fixtures it changes, has a mutation of its own, which runs only that module's tests: the
# one TS-T03, TS-T04, or TS-T05 gave it, or, for a module none of them changed, the change nearest
# what it checks. The mutations with caught_by show what each strengthened check now catches: each
# runs only the copies that didn't check it at the base, which miss it there and catch it on the
# branch; and that the records checks' cases, renamed or moved, still catch what they caught.

# Each test module TS-T06 changes, or whose fixtures it changes, with a change a test there
# catches: an earlier task's, for each module one of them changed.

