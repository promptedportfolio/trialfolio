# TS-T05's list of the check of the tests (docs/test-refactoring.md), which it ran on its base and
# on its branch. TS-T05 writes the editors of saved records once, in tests/support/broken_runs.py,
# and writes the core's write_run fixture's run through Execution, so each test module it changes,
# or whose fixture or editors it changes, has a mutation of its own, which runs only that module's
# tests: the one TS-T04 gave it, or, for a module TS-T04 didn't change, the change nearest what it
# checks. The mutations with caught_by are those of the checks the moved editors' breaks reach,
# each of which a test made with them must still catch; and two of what write_run's runs now
# take from Execution, the reproducibility and the counts their manifests record, which the report
# tests read, and which no test of write_run's runs reached at the base, whose manifest the fixture
# built itself.

# Each test module TS-T05 changes, or whose fixture or editors it changes, with a change a test
# there catches: TS-T04's, for each module TS-T04 changed.

[[mutation]]
name = '''an attempt stopped while it authenticated is recorded as possibly charged, for core/test_experiment_resume'''
file = "src/trialfolio/experiment_execution/completion.py"
old = '''        "possibly_charged": False,'''
new = '''        "possibly_charged": True,'''
tests = ["tests/core/test_experiment_resume.py"]

[[mutation]]
name = '''the record of an attempt stopped after its update record says it stopped elsewhere, for core/test_ranking_resume'''
file = "src/trialfolio/experiment_execution/completion.py"
old = '''f" written, before the rank_update's response was saved. {detail}"'''
new = '''f" written, before the rank_update's request was saved. {detail}"'''
tests = ["tests/core/test_ranking_resume.py"]

[[mutation]]
name = '''a report says what isn't assessed in other words, for core/test_report'''
