# TS-T04's list of the check of the tests (docs/test-refactoring.md), which it ran on its base and
# on its branch. TS-T04 writes the core's helpers once, under tests/support/, and the fake server's
# setup and the fixtures' paths everywhere, and changes each test module that used them, so each
# test module it changes has a mutation of its own, which runs only that module's tests: one of a
# few changes of the code they reach, the one nearest what the module checks. A module TS-T03
# changed keeps the mutation TS-T03 gave it. The mutation with caught_by is that of the check
# TS-T04 strengthens: a refused resume's "nothing is written", which now sees a new empty
# directory. The packaging tests' mutations are in ts-t04-packaging.toml, and the reference tests'
# in ts-t04-reference.toml, which runs on the owner's machine.

# Each test module TS-T04 changes, with a change a test there catches.

