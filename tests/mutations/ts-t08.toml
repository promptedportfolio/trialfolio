# TS-T08's list of the check of the tests (docs/test-refactoring.md), which it ran on its base and
# on its branch. TS-T08 shortens the long functions the plan's findings name, and gives two
# modules' traces the word. So each module it changes has a mutation of its own, which runs only
# that module's tests: an earlier task's, for each module one changed, or, for the two whose
# docstrings alone change, which none did, the change nearest what they check. Then each function
# it shortens has one or more of its own, which run only its tests: on the branch, the tests it
# became, and at the base, in base_tests, the test it was. Each test a function was split into
# has one whose caught_by names it, so each shows that its part of the checks went with it.

