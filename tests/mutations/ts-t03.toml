# TS-T03's list of the check of the tests (docs/test-refactoring.md), which it ran on its base and
# on its branch. TS-T03 writes the interface's helpers once, under tests/support/, and changes each
# test module that used them, so each test module it changes has a mutation of its own, which runs
# only that module's tests: one of a few changes of the code they reach, the one nearest what the
# module checks. The mutations with caught_by are those of the checks TS-T03 strengthens: the
# summary's cases by key, which no two cases share; the summary a new process writes, read as
# Outcome reads one; and the store doubles, each now the real store with one method changed. The
# reference tests' mutations are in ts-t03-reference.toml, which runs on the owner's machine.

# Each test module TS-T03 changes, with a change a test there catches.

