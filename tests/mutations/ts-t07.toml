# TS-T07's list of the check of the tests (docs/test-refactoring.md), which it ran on its base and
# on its branch. TS-T07 separates seven test modules along their seams, and names
# tests/core/test_report.py test_run_report.py. So each module it changes has a mutation of its
# own, which runs only that module's tests: on the branch, the module; at the base, base_tests,
# the IDs the same tests had there, in the module they were separated from. Each is an earlier
# task's, for a module one of them changed, or, for a module TS-T07 adds, the change nearest what
# it checks. The modules whose docstrings name a separated module have their earlier task's too.

