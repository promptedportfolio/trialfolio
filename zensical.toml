# Builds the user manual, manual/, into a site (docs/user-manual.md, tooling and hosting).
# `uv run zensical build --clean` writes it to site/, which Git ignores. scripts/check builds it
# and checks the built site, and .github/workflows/docs.yml publishes it from main.
[project]
site_name = "Trial Folio"
site_description = "How to use Trial Folio, a command-line tool for researching strategies with the Portfolio123 API."
site_url = "https://promptedportfolio.github.io/trialfolio/"
docs_dir = "manual"
site_dir = "site"
# A broken link or anchor between pages fails the build.
strict = true
# There's no repo_url. With one, the theme's script would ask GitHub's API for the repository's
# facts from each reader's browser, and the site loads nothing from another host (UM-AC07).
nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
    "tutorials/first-backtest.md",
    "tutorials/first-experiment.md",
  ] },
  { "How-to guides" = [
    "how-to/store-credentials.md",
    "how-to/re-render-a-report.md",
    "how-to/compare-runs.md",
    "how-to/recover-from-an-interrupt.md",
    "how-to/repeat-a-case.md",
    "how-to/revise-an-experiment.md",
    "how-to/vary-a-ranking-systems-weights.md",
    "how-to/take-a-ranking-snapshot.md",
    "how-to/use-from-a-script.md",
  ] },
  { "Reference" = [
    "reference/cli.md",
    "reference/screen-configuration.md",
    "reference/review-configuration.md",
    "reference/experiment-configuration.md",
    "reference/ranking-definitions.md",
    "reference/ranking-snapshot-configuration.md",
    "reference/outputs.md",
    "reference/output-fields.md",
    "reference/errors.md",
    "reference/json-summary.md",
  ] },
  { "Explanation" = [
    "explanation/plans-and-approval.md",
    "explanation/credits-and-uncertain-charges.md",
    "explanation/reproducibility.md",
    "explanation/what-a-backtest-can-support.md",
    "explanation/apirankingsystem-and-the-ranking-lock.md",
    "explanation/the-research-method.md",
    "explanation/where-trial-folio-is-going.md",
  ] },
]
# The third-party notices page, third-party-notices.md, isn't in the navigation: every page's
# footer links to it (docs/user-manual.md, tooling and hosting), and scripts/check fails when one
# doesn't.

[project.theme]
# No web fonts: the theme would load them from Google's servers (UM-AC07). Pages use the
# reader's system fonts.
font = false
# overrides/partials/copyright.html replaces the theme's footer text with the notices every page
# carries (docs/user-manual.md, rule 3).
custom_dir = "overrides"
# The four sections are tabs across the top. Instant navigation loads each page from this site
# only, as the search does.
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.path",
  "navigation.footer",
  "navigation.top",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  "content.code.copy",
]
# Lucide's flask icon, in the header. The favicon is the same icon, in the theme's teal primary
# color: #009485, and its light shade, #26a699, when the browser is dark. The file names them
# itself, so a change to primary changes them there by hand (manual/third-party-notices.md,
# Icons).
favicon = "assets/favicon.svg"

[project.theme.icon]
logo = "lucide/flask-conical"

# Light and dark schemes, with a switch in the header, following the reader's system setting
# until they choose. The first entry, the system setting, names the colors too. Each page's
# markup starts in the first entry's colors, which would be the theme's indigo without them, and
# keeps them until the theme's script runs, or for good without it.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
